notes = ["Transcribed from 6 page images by Claude (opus) via claude -p on 2026-09-07; not yet checked by a person", "Statement for KATTER, ROBERT CARL, Division of Kennedy, QLD, 48th Parliament. Cover page bears registry stamp 'PROCESSED 09 Sep 2025'.", "No signature/date line appears on the statement pages supplied (pages 1-5), so date_lodged is left null; the only date in the document is the handwritten '26/08/25' on the notification of alterations page (page 6).", "Item 2(i): the Self and Spouse/partner cells in the 'Nature of its operation' column carry handwritten diagonal pen strokes across parts of the text (through 'interest in the gulf' / 'benefit directly and indirectly' / 'beef highway' in the Self cell and through 'interest in a trust that has interests in some cattle operations in Cape York' in the Spouse cell). The typed text remains legible and is transcribed in full; whether the strokes indicate deletion is unclear.", "Item 2(i): no trust/nominee company name or beneficial interest is given for the Self or Spouse rows; only the 'Nature of its operation' column is filled in.", "Item 3: the Spouse/partner row is blank (no 'N/A'), so no entry is recorded.", "Item 14: the Spouse/partner and Dependent children rows are blank, so no entries are recorded.", "Page 6 (notification of alteration(s) since dissolution or date of election): both the ADDITION and DELETION tables contain only a handwritten 'N/A', so no alterations are recorded. The signature line is blank; the date reads '26/08/25'."]

