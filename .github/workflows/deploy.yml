name: Build and deploy site

# Rebuilds on every push to main, so each nightly run that weddle pushes
# republishes the site. Nothing here touches aph.gov.au or a model: the site is
# built from the committed data/ tree. No secrets needed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "PRODUCT.md"
      - "DESIGN.md"
      - "LICENSE"
      - ".gitignore"
      - "ops/**"
      - "raw/**" # raw fetches only matter once parsed into data/
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      # The only place the Python tests and typecheck run automatically.
      - name: Python tests
        run: uv run python -m pytest

      - name: Python typecheck
        run: uv run --with ty==0.0.75 ty check

      - name: Check data/ is in step with raw/ and the parsers
        run: |
          uv run peculiar parse
          uv run peculiar people
          uv run peculiar schema
          git diff --exit-code -- data/

      - name: Setup mise (node + pnpm)
        uses: jdx/mise-action@v4

      - name: Locate pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Astro build artefacts
        uses: actions/cache@v6
        with:
          path: site/node_modules/.astro
          key: ${{ runner.os }}-astro-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Install site deps
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Lint
        run: pnpm run lint
        working-directory: site

      - name: Lint CSS
        run: pnpm run lint:css
        working-directory: site

      - name: Format check
        run: pnpm run format:check
        working-directory: site

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: site

      - name: Test
        run: pnpm run test
        working-directory: site

      - name: Build
        run: pnpm run build
        working-directory: site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          include-hidden-files: true # keep .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
